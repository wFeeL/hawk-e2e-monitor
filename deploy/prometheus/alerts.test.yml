rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="monitor", instance="monitor:8090"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: MonitorDown
        exp_alerts:
          - exp_labels: { job: monitor, instance: "monitor:8090" }
            exp_annotations: { summary: The monitor does not answer on its metrics port. }

  - interval: 1m
    input_series:
      - series: 'up{job="monitor", instance="monitor:8090"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: MonitorDown
        exp_alerts: []

  # No scrape of the monitor at all: the series is absent, not zero.
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus", instance="localhost:9090"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: MonitorDown
        exp_alerts: []
      - eval_time: 6m
        alertname: MonitorDown
        exp_alerts:
          - exp_labels: { job: monitor }
            exp_annotations: { summary: The monitor does not answer on its metrics port. }

  - interval: 1m
    input_series:
      - series: 'hawk_e2e_last_run_timestamp_seconds{scenario="send-and-receive-event"}'
        values: "0x60"
      - series: 'hawk_e2e_scenario_interval_seconds{scenario="send-and-receive-event"}'
        values: "600x60"
      - series: 'hawk_e2e_last_run_timestamp_seconds{scenario="endpoints-probe"}'
        values: "0x60"
      - series: 'hawk_e2e_scenario_interval_seconds{scenario="endpoints-probe"}'
        values: "90x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ScenarioStale
        exp_alerts: []
      - eval_time: 45m
        alertname: ScenarioStale
        exp_alerts:
          - exp_labels: { scenario: send-and-receive-event }
            exp_annotations: { summary: "send-and-receive-event has not finished a run for more than two intervals." }

  - interval: 1m
    input_series:
      - series: 'hawk_e2e_last_status{scenario="check-notification"}'
        values: "1 1 0 0 0"
      - series: 'hawk_e2e_last_status{scenario="endpoints-probe"}'
        values: "0 0 0 0 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: ScenarioFailing
        exp_alerts:
          - exp_labels: { scenario: check-notification }
            exp_annotations: { summary: "The last run of check-notification failed." }

  - interval: 1h
    input_series:
      - series: 'hawk_e2e_runs_total{scenario="send-and-receive-event", status="ok", trigger="schedule"}'
        values: "0 2 4 6 8 10 12"
      - series: 'hawk_e2e_runs_total{scenario="send-and-receive-event", status="failed", trigger="schedule"}'
        values: "0 1 2 3 4 5 6"
      - series: 'hawk_e2e_runs_total{scenario="send-and-receive-event", status="monitor_abort", trigger="schedule"}'
        values: "0 5 10 15 20 25 30"
    alert_rule_test:
      - eval_time: 6h
        alertname: SuccessRateLow
        exp_alerts:
          - exp_labels: { scenario: send-and-receive-event }
            exp_annotations: { summary: "Less than 90% of send-and-receive-event runs passed in 6 hours." }

  - interval: 1h
    input_series:
      - series: 'hawk_e2e_runs_total{scenario="sourcemaps", status="ok", trigger="schedule"}'
        values: "0 1 1 1 1 1 1"
      - series: 'hawk_e2e_runs_total{scenario="sourcemaps", status="failed", trigger="schedule"}'
        values: "0 0 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 6h
        alertname: SuccessRateLow
        exp_alerts: []

  # Six hourly runs, one failed: too few runs for this rule, ScenarioFailing covers it.
  - interval: 1m
    input_series:
      - series: 'hawk_e2e_runs_total{scenario="sourcemaps", status="ok", trigger="schedule"}'
        values: "0x29 1x59 2x59 3x59 4x59 5x59 5x30"
      - series: 'hawk_e2e_runs_total{scenario="sourcemaps", status="failed", trigger="schedule"}'
        values: "0x329 1x30"
    alert_rule_test:
      - eval_time: 6h
        alertname: SuccessRateLow
        exp_alerts: []

  # Seven runs in six hours, one failed (86%): enough runs, so it fires.
  - interval: 1m
    input_series:
      - series: 'hawk_e2e_runs_total{scenario="check-notification", status="ok", trigger="schedule"}'
        values: "0x9 1x49 2x49 3x49 4x49 5x49 6x49 6x50"
      - series: 'hawk_e2e_runs_total{scenario="check-notification", status="failed", trigger="schedule"}'
        values: "0x309 1x50"
    alert_rule_test:
      - eval_time: 6h
        alertname: SuccessRateLow
        exp_alerts:
          - exp_labels: { scenario: check-notification }
            exp_annotations: { summary: "Less than 90% of check-notification runs passed in 6 hours." }

  - interval: 1m
    input_series:
      - series: hawk_e2e_alert_backlog_seconds
        values: "0 600 1900"
    alert_rule_test:
      - eval_time: 2m
        alertname: AlertsNotDelivered
        exp_alerts:
          - exp_labels: {}
            exp_annotations: { summary: Alerts have waited for delivery to codex.bot for more than 30 minutes. }

  - interval: 1h
    input_series:
      - series: 'hawk_e2e_runs_total{scenario="check-notification", status="skipped", trigger="schedule"}'
        values: "0 1 2 3 4 5 6 7"
      - series: 'hawk_e2e_runs_total{scenario="check-notification", status="ok", trigger="schedule"}'
        values: "0 0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 7h
        alertname: ScenarioOnlySkipped
        exp_alerts:
          - exp_labels: { scenario: check-notification }
            exp_annotations: { summary: "check-notification only skipped its checks for 6 hours." }
