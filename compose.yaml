name: hawk-e2e-monitor

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  monitor:
    build: .
    image: hawk-e2e-monitor:local
    env_file: .env
    environment:
      # Fixed so that .env cannot move the ports away from the mapping, healthcheck and tunnel.
      RECEIVER_HOST: 0.0.0.0
      RECEIVER_PORT: 8091
      INTERNAL_HOST: 0.0.0.0
      INTERNAL_PORT: 8090
      TUNNEL_METRICS_URL: http://tunnel:2000
      DATABASE_PATH: /app/data/monitor.db
    volumes:
      - monitor-data:/app/data
    ports:
      - "127.0.0.1:${MONITOR_INTERNAL_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 15s
    # Podman builds OCI images by default and drops the HEALTHCHECK of the Dockerfile.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://monitor:8091"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    profiles: [observability]
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    logging: *logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: [observability]
    image: docker.io/grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    env_file:
      - path: .env.grafana
        required: false
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'GF_SECURITY_ADMIN_PASSWORD is empty: copy grafana.env.example to .env.grafana' >&2; exit 1; }; exec /run.sh"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    logging: *logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  monitor-data:
  prometheus-data:
  grafana-data:
